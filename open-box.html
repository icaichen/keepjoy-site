<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open KeepJoy Storage</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f6f7f8;color:#15191e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:28px;padding:32px;box-shadow:0 18px 50px rgba(15,23,42,.08);text-align:center}
    .icon{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:#e9f8f4;display:grid;place-items:center;font-size:34px}
    h1{font-size:27px;margin:0 0 8px}
    p{color:#6b7280;line-height:1.55;margin:0 0 24px}
    button,a.store{width:100%;min-height:52px;border-radius:15px;border:0;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
    button{background:#16c7ad;color:#fff}
    .store{margin-top:10px;background:#f0f2f4;color:#24292f}
    .code{margin-top:20px;color:#9ca3af;font-size:12px;word-break:break-all}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div class="icon">📦</div>
    <h1>Open this KeepJoy container</h1>
    <p>View what is stored inside this container in KeepJoy.</p>
    <button id="open">Open KeepJoy</button>
    <a class="store" id="store" href="https://apps.apple.com/us/app/keepjoy/id6755450700">Get KeepJoy</a>
    <div class="code" id="code"></div>
  </section>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const id = (params.get('id') || '').trim();
  const deepLink = id ? 'keepjoy://storage/box/' + encodeURIComponent(id) : '';
  const isAndroid = /Android/i.test(navigator.userAgent);
  const store = document.getElementById('store');
  if (isAndroid) {
    store.href = 'https://play.google.com/store/apps/details?id=com.keepjoy.app';
  }
  document.getElementById('code').textContent =
    id ? 'Container ' + id : 'Missing container ID';
  function openApp() {
    if (!deepLink) return;
    location.href = deepLink;
  }
  document.getElementById('open').addEventListener('click', openApp);
  if (deepLink) setTimeout(openApp, 250);
</script>
</body>
</html>
